# See example-customera-basic.yml for field descriptions. This is the Premium-tier example:
# same as Advanced plus the enhanced proactive monitoring log alert (error-event rate) and a
# second email receiver representing the 24/7 on-call rotation required for the Premium SLA.

variables:
  serviceConnection: 'sc-customerc-prod'

  subscriptionId: '00000000-0000-0000-0000-000000000000'
  resourceGroupName: 'rg-azurelocal-customerc-prod'
  location: 'westeurope'

  serviceTier: 'Premium'

  clusterResourceId: '/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-azurelocal-customerc-prod/providers/Microsoft.AzureStackHCI/clusters/azlclustercustomerc'
  logAnalyticsWorkspaceResourceId: '/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-azurelocal-customerc-prod/providers/Microsoft.OperationalInsights/workspaces/law-azurelocal-customerc'

  actionGroupName: 'ag-azurelocal-customerc-prod'
  actionGroupShortName: 'azlalerts'

  emailReceiversJson: '[{"name":"fmp-ops","emailAddress":"azurelocal-ops@example.com","useCommonAlertSchema":true},{"name":"fmp-oncall","emailAddress":"azurelocal-oncall@example.com","useCommonAlertSchema":true}]'
  webhookReceiversJson: '[{"name":"fmp-itsm-webhook","serviceUri":"https://example.freshservice.com/api/v2/webhook/azurelocal-alerts","useCommonAlertSchema":true}]'

  cpuThresholdPercent: '85'
  memoryThresholdPercent: '85'
  storageFreeBytesThreshold: '214748364800'
  memoryAvailableBytesThreshold: '1073741824'
  volumeLatencyReadThresholdSeconds: '0.5'
  volumeLatencyWriteThresholdSeconds: '0.5'
  networkInThresholdBytesPerSecond: '500000000000'
  networkOutThresholdBytesPerSecond: '200000000000'
  includeServiceHealth: 'true'
  # Example maintenance window (recurring, every Saturday 22:00-02:00 UTC) - uncomment/adapt to enable:
  # suppressionWindowsJson: '[{"name":"monthly-patch-window","description":"Monthly Azure Local solution update window","effectiveFrom":"2026-01-01T00:00:00","effectiveUntil":"2027-01-01T00:00:00","timeZone":"UTC","recurrenceType":"Weekly","startTime":"22:00:00","endTime":"02:00:00","daysOfWeek":["Saturday"]}]'
  suppressionWindowsJson: '[]'
  # Premium commits to 24/7 alert response under SLA - never suppress off-hours.
  enableOffHoursSuppression: 'false'
  serviceHoursStart: '07:00:00'
  serviceHoursEnd: '17:00:00'
  serviceHoursTimeZone: 'Romance Standard Time'
  heartbeatMissingMinutes: '10'
