# See example-customera-basic.yml for field descriptions. All Bicep template parameters for this
# Premium-tier customer live in the companion example-customerc-premium.bicepparam file.

variables:
  serviceConnection: 'sc-customerc-prod'
  subscriptionId: '00000000-0000-0000-0000-000000000000'
  bicepParamFile: 'pipeline/environments/example-customerc-premium.bicepparam'

  # ARM resource ID of the Data Collection Rule collecting this cluster's Windows Event Logs.
  # Leave empty to attempt auto-discovery from an Arc node in clusterResourceId's resource group.
  # Required (directly or via auto-discovery) for the cluster-quorum/service-watchdog/Hyper-V log
  # alerts to actually receive data - see docs/service-tiers-and-alerts.md. Not a Bicep template
  # parameter - used only by Deploy-AzureLocalAlerts.ps1's pre-flight DCR extension check.
  dcrResourceId: ''
