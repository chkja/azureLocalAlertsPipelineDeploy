# One minimal variables file per Azure Local cluster / tenant. Add a new file here to onboard a
# new customer or cluster, then add its base file name (without extension) to the
# `environmentFile` allowed values list in pipeline/azure-pipelines.yml.
#
# All Bicep template parameters (thresholds, receivers, service-tier, resource IDs, etc.) live in
# the companion example-customera-basic.bicepparam file next to this one - that is the file to
# edit when tuning alert thresholds or onboarding scope. This YAML file only carries the
# non-template, pipeline-level metadata that a .bicepparam file cannot express: which Azure
# DevOps service connection/tenant to deploy with, the subscription context, and (for the
# script's pre-flight DCR event-log check only, not a Bicep parameter) the DCR resource ID.
#
# Committing these values in git (instead of an Azure DevOps variable group/library) is the
# intentional "config as code" approach requested: the CD pipeline re-applies exactly what is
# committed here on every run, so manual portal edits (drift) get reverted on the next merge to
# main instead of silently persisting.

variables:
  # Which Azure DevOps service connection (Azure Resource Manager) to deploy with.
  # This determines which Azure AD tenant / subscription the pipeline authenticates to.
  serviceConnection: 'sc-customera-prod'

  # Subscription the service connection authenticates to - used for `az account set --subscription`
  # before validating/deploying. Must match the subscription referenced by the resource IDs in
  # the companion .bicepparam file.
  subscriptionId: '00000000-0000-0000-0000-000000000000'

  # Path (relative to repo root) to this customer's Bicep parameters file.
  bicepParamFile: 'pipeline/environments/example-customera-basic.bicepparam'

  # ARM resource ID of the Data Collection Rule collecting this cluster's Windows Event Logs.
  # Leave empty to attempt auto-discovery from an Arc node in clusterResourceId's resource group.
  # Ignored for Basic tier (no log-based alerts). Not a Bicep template parameter - used only by
  # Deploy-AzureLocalAlerts.ps1's pre-flight DCR extension check.
  dcrResourceId: ''
