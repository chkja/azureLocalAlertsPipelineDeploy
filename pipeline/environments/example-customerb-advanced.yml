# See example-customera-basic.yml for field descriptions. This is the Advanced-tier example:
# includes the same baseline metric alerts plus capacity metric alerts and log-based alerts,
# which requires a Log Analytics workspace resource ID (Advanced/Premium prerequisite: Insights
# log collection must already be enabled on the cluster).

variables:
  serviceConnection: 'sc-customerb-prod'

  subscriptionId: '00000000-0000-0000-0000-000000000000'
  resourceGroupName: 'rg-azurelocal-customerb-prod'
  location: 'westeurope'

  serviceTier: 'Advanced'

  clusterResourceId: '/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-azurelocal-customerb-prod/providers/Microsoft.AzureStackHCI/clusters/azlclustercustomerb'
  logAnalyticsWorkspaceResourceId: '/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-azurelocal-customerb-prod/providers/Microsoft.OperationalInsights/workspaces/law-azurelocal-customerb'

  actionGroupName: 'ag-azurelocal-customerb-prod'
  actionGroupShortName: 'azlalerts'

  emailReceiversJson: '[{"name":"fmp-ops","emailAddress":"azurelocal-ops@example.com","useCommonAlertSchema":true}]'
  webhookReceiversJson: '[{"name":"fmp-itsm-webhook","serviceUri":"https://example.freshservice.com/api/v2/webhook/azurelocal-alerts","useCommonAlertSchema":true}]'

  cpuThresholdPercent: '85'
  memoryThresholdPercent: '85'
  storageFreeBytesThreshold: '214748364800'
  memoryAvailableBytesThreshold: '1073741824'
  volumeLatencyReadThresholdSeconds: '0.5'
  volumeLatencyWriteThresholdSeconds: '0.5'
  networkInThresholdBytesPerSecond: '500000000000'
  networkOutThresholdBytesPerSecond: '200000000000'
  includeServiceHealth: 'true'
  suppressionWindowsJson: '[]'
  # Suppress action-group notifications outside the committed Advanced working-hours window (per
  # the service description: alert intake/triage "during working hours"). Alert rules still
  # evaluate 24/7 - only notifications are silenced outside these hours.
  enableOffHoursSuppression: 'true'
  serviceHoursStart: '07:00:00'
  serviceHoursEnd: '17:00:00'
  serviceHoursTimeZone: 'Romance Standard Time'
  # Optional throttle for the log-based alerts (heartbeat/volume health): ISO 8601 duration (e.g.
  # 'PT1H') for repeat notifications while an alert remains unresolved. Empty = stateful/single-fire.
  logAlertsMuteActionsDuration: ''
  # Substrings matched against Service Control Manager events for the critical-service-down
  # watchdog alert (HciSvc/mochostagent/wssdcloudagent/wssdagent) - verify against your nodes'
  # exact DisplayName (Get-Service ... | Select-Object Name, DisplayName) and adjust if needed.
  criticalServiceNamesJson: '["HciSvc","Health Service","mochostagent","MOC HostAgent","wssdcloudagent","WSSD Cloud Agent","wssdagent","WSSD Agent"]'
  # ARM resource ID of the Data Collection Rule collecting this cluster's Windows Event Logs.
  # Leave empty to attempt auto-discovery from an Arc node in clusterResourceId's resource group.
  # Required (directly or via auto-discovery) for the cluster-quorum/service-watchdog/Hyper-V
  # log alerts to actually receive data - see docs/service-tiers-and-alerts.md.
  dcrResourceId: ''
  heartbeatMissingMinutes: '10'
