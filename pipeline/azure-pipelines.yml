# Azure Local Alerts - CD pipeline
#
# Purpose
#   Deploys the Action Group + tier-appropriate metric/log alert rules (bicep/) for one Azure
#   Local cluster, using the config committed in pipeline/environments/<environmentFile>.yml plus
#   the companion pipeline/environments/<environmentFile>.bicepparam file it points to.
#
# Config-as-code / drift prevention
#   The .yml file pins non-template metadata (service connection/tenant, subscription ID, DCR
#   resource ID for the pre-flight check). The .bicepparam file pins every actual Bicep template
#   parameter: service tier, resource group, cluster/workspace resource IDs, thresholds, and
#   action group receivers. Because this pipeline is triggered on every push to main that touches
#   bicep/** or pipeline/environments/**, any manual change made in the Azure portal (drift) is
#   silently reverted back to the committed state on the next run - Bicep deployments are
#   idempotent/declarative, so re-applying the same template is safe.
#
#   Deployments are wrapped in an Azure Deployment Stack (deny mode: denyDelete, see
#   scripts/Deploy-AzureLocalAlerts.ps1) so every resource created - including the resource
#   group - is tracked as a single managed unit, and deletion of any managed resource outside
#   the stack (e.g. an accidental portal delete) is denied by Azure Resource Manager.
#
# Selecting tenant + tier
#   - For scheduled/CI runs: edit the relevant pipeline/environments/<name>.bicepparam file (tier,
#     thresholds, receivers, etc.) and/or its companion .yml file (service connection), then merge
#     to main. The pipeline auto-deploys using the values committed there - no manual pipeline
#     configuration needed.
#   - For manual/ad-hoc runs: use "Run pipeline" and pick `environmentFile` from the dropdown.
#     `serviceConnectionOverride` lets you deploy to a different tenant once without editing the
#     committed file (useful for testing). There is no service-tier override - since the tier is
#     a typed Bicep parameter inside the .bicepparam file, override it there (or with a one-off
#     local `pwsh -File ./scripts/Deploy-AzureLocalAlerts.ps1 -BicepParamFile ...` run) instead.
#
# Prerequisites
#   - One Azure DevOps ARM service connection per tenant/subscription (name must match the
#     `serviceConnection` value used in the relevant environment file, unless overridden above).
#   - Bicep CLI is bundled with recent Azure CLI images on Microsoft-hosted agents; no separate
#     install step required.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - bicep/*
      - pipeline/environments/*
      - scripts/*

pr: none

parameters:
  - name: environmentFile
    displayName: 'Environment (tenant/cluster) to deploy'
    type: string
    default: 'example-customera-basic'
    values:
      - example-customera-basic
      - example-customerb-advanced
      - example-customerc-premium
      # Add your own tenant here after creating pipeline/environments/<name>.yml + .bicepparam

  - name: serviceConnectionOverride
    displayName: 'Override service connection (leave empty to use the value committed in the environment file)'
    type: string
    default: ''

  - name: whatIfOnly
    displayName: 'Validate only (what-if), do not apply changes'
    type: boolean
    default: false

variables:
  - template: environments/${{ parameters.environmentFile }}.yml
  # effectiveServiceConnection resolves to the override parameter when supplied at queue time,
  # otherwise falls back to the value committed in the environment file.
  - ${{ if ne(parameters.serviceConnectionOverride, '') }}:
      - name: effectiveServiceConnection
        value: ${{ parameters.serviceConnectionOverride }}
  - ${{ if eq(parameters.serviceConnectionOverride, '') }}:
      - name: effectiveServiceConnection
        value: $(serviceConnection)

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Validate
    displayName: 'Validate (what-if)'
    jobs:
      - job: WhatIf
        displayName: 'az stack sub validate'
        steps:
          - task: AzureCLI@2
            displayName: 'Run Deploy-AzureLocalAlerts.ps1 -WhatIf'
            inputs:
              azureSubscription: '$(effectiveServiceConnection)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $ErrorActionPreference = 'Stop'
                ./scripts/Deploy-AzureLocalAlerts.ps1 `
                  -SubscriptionId '$(subscriptionId)' `
                  -BicepParamFile '$(bicepParamFile)' `
                  -DcrResourceId '$(dcrResourceId)' `
                  -DenySettingsMode 'denyDelete' `
                  -ActionOnUnmanage 'deleteResources' `
                  -WhatIf

  - stage: Deploy
    displayName: 'Deploy'
    condition: and(succeeded(), eq('${{ parameters.whatIfOnly }}', 'False'))
    dependsOn: Validate
    jobs:
      - deployment: DeployAlerts
        displayName: 'Deploy Azure Local alerts'
        environment: 'azure-local-alerts-${{ parameters.environmentFile }}'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  displayName: 'Run Deploy-AzureLocalAlerts.ps1'
                  inputs:
                    azureSubscription: '$(effectiveServiceConnection)'
                    scriptType: 'pscore'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      $ErrorActionPreference = 'Stop'
                      ./scripts/Deploy-AzureLocalAlerts.ps1 `
                        -SubscriptionId '$(subscriptionId)' `
                        -BicepParamFile '$(bicepParamFile)' `
                        -DcrResourceId '$(dcrResourceId)' `
                        -DenySettingsMode 'denyDelete' `
                        -ActionOnUnmanage 'deleteResources'

