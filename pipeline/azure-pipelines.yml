# yaml-language-server: $schema=none
# Azure Local Alerts - CD pipeline (Azure DevOps only, see README.md)
#
# Generates one Validate job + one Deploy job per entry in the `environments` parameter below.
# To onboard a new customer: add its .bicepparam file, then append an entry here.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - bicep/*
      - pipeline/environments/*
      - scripts/*

pr: none

parameters:
  - name: whatIfOnly
    displayName: 'Validate only (what-if), do not apply changes'
    type: boolean
    default: false
  - name: environments
    type: object
    default:
      - name: example-customera-basic
        serviceConnection: sc-customera-prod
        subscriptionId: '00000000-0000-0000-0000-000000000000'
        bicepParamFile: pipeline/environments/example-customera-basic.bicepparam
        dcrResourceId: ''
      - name: example-customerb-advanced
        serviceConnection: sc-customerb-prod
        subscriptionId: '00000000-0000-0000-0000-000000000000'
        bicepParamFile: pipeline/environments/example-customerb-advanced.bicepparam
        dcrResourceId: ''
      - name: example-customerc-premium
        serviceConnection: sc-customerc-prod
        subscriptionId: '00000000-0000-0000-0000-000000000000'
        bicepParamFile: pipeline/environments/example-customerc-premium.bicepparam
        dcrResourceId: ''

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Validate
    displayName: 'Validate (what-if)'
    jobs:
      - ${{ each env in parameters.environments }}:
          - job: WhatIf_${{ replace(env.name, '-', '_') }}
            displayName: 'az stack sub validate - ${{ env.name }}'
            steps:
              - checkout: self
              - task: AzureCLI@2
                displayName: 'Run Deploy-AzureLocalAlerts.ps1 -WhatIf'
                inputs:
                  azureSubscription: ${{ env.serviceConnection }}
                  scriptType: 'pscore'
                  scriptLocation: 'inlineScript'
                  inlineScript: |
                    $ErrorActionPreference = 'Stop'
                    ./scripts/Deploy-AzureLocalAlerts.ps1 `
                      -SubscriptionId '${{ env.subscriptionId }}' `
                      -BicepParamFile '${{ env.bicepParamFile }}' `
                      -DcrResourceId '${{ env.dcrResourceId }}' `
                      -WhatIf

  - stage: Deploy
    displayName: 'Deploy'
    dependsOn: Validate
    condition: and(succeeded(), eq('${{ parameters.whatIfOnly }}', 'False'))
    jobs:
      - ${{ each env in parameters.environments }}:
          - deployment: Deploy_${{ replace(env.name, '-', '_') }}
            displayName: 'Deploy Azure Local alerts - ${{ env.name }}'
            environment: 'azure-local-alerts-${{ env.name }}'
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: self
                    - task: AzureCLI@2
                      displayName: 'Run Deploy-AzureLocalAlerts.ps1'
                      inputs:
                        azureSubscription: ${{ env.serviceConnection }}
                        scriptType: 'pscore'
                        scriptLocation: 'inlineScript'
                        inlineScript: |
                          $ErrorActionPreference = 'Stop'
                          ./scripts/Deploy-AzureLocalAlerts.ps1 `
                            -SubscriptionId '${{ env.subscriptionId }}' `
                            -BicepParamFile '${{ env.bicepParamFile }}' `
                            -DcrResourceId '${{ env.dcrResourceId }}'
