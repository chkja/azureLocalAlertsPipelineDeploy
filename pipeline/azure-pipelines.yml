# Azure Local Alerts - CD pipeline
#
# Purpose
#   Deploys the Action Group + tier-appropriate metric/log alert rules (bicep/) for one Azure
#   Local cluster, using the config committed in pipeline/environments/<environmentFile>.yml.
#
# Config-as-code / drift prevention
#   Each environment file pins: service connection (tenant), subscription, resource group,
#   service tier, cluster/workspace resource IDs, and action group receivers. Because this
#   pipeline is triggered on every push to main that touches bicep/** or pipeline/environments/**,
#   any manual change made in the Azure portal (drift) is silently reverted back to the committed
#   state on the next run - Bicep deployments are idempotent/declarative, so re-applying the same
#   template is safe.
#
#   Deployments are wrapped in an Azure Deployment Stack (deny mode: denyDelete, see
#   scripts/Deploy-AzureLocalAlerts.ps1) so every resource created - including the resource
#   group - is tracked as a single managed unit, and deletion of any managed resource outside
#   the stack (e.g. an accidental portal delete) is denied by Azure Resource Manager.
#
# Selecting tenant + tier
#   - For scheduled/CI runs: edit the relevant pipeline/environments/<name>.yml file and merge to
#     main. The pipeline auto-deploys using the values committed there (service connection + tier
#     included) - no manual pipeline configuration needed.
#   - For manual/ad-hoc runs: use "Run pipeline" and pick `environmentFile` from the dropdown.
#     `serviceConnectionOverride` and `serviceTierOverride` let you deploy a different tenant or
#     tier once without editing the committed file (useful for testing).
#
# Prerequisites
#   - One Azure DevOps ARM service connection per tenant/subscription (name must match the
#     `serviceConnection` value used in the relevant environment file, unless overridden above).
#   - Bicep CLI is bundled with recent Azure CLI images on Microsoft-hosted agents; no separate
#     install step required.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - bicep/*
      - pipeline/environments/*
      - scripts/*

pr: none

parameters:
  - name: environmentFile
    displayName: 'Environment (tenant/cluster) to deploy'
    type: string
    default: 'example-customera-basic'
    values:
      - example-customera-basic
      - example-customerb-advanced
      - example-customerc-premium
      # Add your own tenant here after creating pipeline/environments/<name>.yml

  - name: serviceConnectionOverride
    displayName: 'Override service connection (leave empty to use the value committed in the environment file)'
    type: string
    default: ''

  - name: serviceTierOverride
    displayName: 'Override service tier (leave empty to use the value committed in the environment file)'
    type: string
    default: ''
    values:
      - ''
      - Basic
      - Advanced
      - Premium

  - name: whatIfOnly
    displayName: 'Validate only (what-if), do not apply changes'
    type: boolean
    default: false

variables:
  - template: environments/${{ parameters.environmentFile }}.yml
  # effectiveServiceConnection / effectiveServiceTier resolve to the override parameter when
  # supplied at queue time, otherwise fall back to the value committed in the environment file.
  - ${{ if ne(parameters.serviceConnectionOverride, '') }}:
      - name: effectiveServiceConnection
        value: ${{ parameters.serviceConnectionOverride }}
  - ${{ if eq(parameters.serviceConnectionOverride, '') }}:
      - name: effectiveServiceConnection
        value: $(serviceConnection)
  - ${{ if ne(parameters.serviceTierOverride, '') }}:
      - name: effectiveServiceTier
        value: ${{ parameters.serviceTierOverride }}
  - ${{ if eq(parameters.serviceTierOverride, '') }}:
      - name: effectiveServiceTier
        value: $(serviceTier)

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Validate
    displayName: 'Validate (what-if)'
    jobs:
      - job: WhatIf
        displayName: 'az stack sub validate'
        steps:
          - task: AzureCLI@2
            displayName: 'Run Deploy-AzureLocalAlerts.ps1 -WhatIf'
            inputs:
              azureSubscription: '$(effectiveServiceConnection)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $ErrorActionPreference = 'Stop'
                $deployArgs = @{
                  SubscriptionId                  = '$(subscriptionId)'
                  ServiceTier                      = '$(effectiveServiceTier)'
                  ResourceGroupName                = '$(resourceGroupName)'
                  Location                         = '$(location)'
                  ClusterResourceId                = '$(clusterResourceId)'
                  LogAnalyticsWorkspaceResourceId  = '$(logAnalyticsWorkspaceResourceId)'
                  ActionGroupName                  = '$(actionGroupName)'
                  ActionGroupShortName             = '$(actionGroupShortName)'
                  EmailReceiversJson               = '$(emailReceiversJson)'
                  WebhookReceiversJson             = '$(webhookReceiversJson)'
                  CpuThresholdPercent              = [int]'$(cpuThresholdPercent)'
                  MemoryThresholdPercent           = [int]'$(memoryThresholdPercent)'
                  StorageFreeBytesThreshold        = [int64]'$(storageFreeBytesThreshold)'
                  MemoryAvailableBytesThreshold    = [int64]'$(memoryAvailableBytesThreshold)'
                  VolumeLatencyReadThresholdSeconds  = '$(volumeLatencyReadThresholdSeconds)'
                  VolumeLatencyWriteThresholdSeconds = '$(volumeLatencyWriteThresholdSeconds)'
                  NetworkInThresholdBytesPerSecond  = [int64]'$(networkInThresholdBytesPerSecond)'
                  NetworkOutThresholdBytesPerSecond = [int64]'$(networkOutThresholdBytesPerSecond)'
                  IncludeServiceHealth              = [bool]::Parse('$(includeServiceHealth)')
                  SuppressionWindowsJson            = '$(suppressionWindowsJson)'
                  EnableOffHoursSuppression        = [bool]::Parse('$(enableOffHoursSuppression)')
                  ServiceHoursStart                = '$(serviceHoursStart)'
                  ServiceHoursEnd                  = '$(serviceHoursEnd)'
                  ServiceHoursTimeZone              = '$(serviceHoursTimeZone)'
                  HeartbeatMissingMinutes          = [int]'$(heartbeatMissingMinutes)'
                  DenySettingsMode                 = 'denyDelete'
                  ActionOnUnmanage                 = 'deleteResources'
                  WhatIf                           = $true
                }
                ./scripts/Deploy-AzureLocalAlerts.ps1 @deployArgs

  - stage: Deploy
    displayName: 'Deploy'
    condition: and(succeeded(), eq('${{ parameters.whatIfOnly }}', 'False'))
    dependsOn: Validate
    jobs:
      - deployment: DeployAlerts
        displayName: 'Deploy Azure Local alerts'
        environment: 'azure-local-alerts-${{ parameters.environmentFile }}'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzureCLI@2
                  displayName: 'Run Deploy-AzureLocalAlerts.ps1'
                  inputs:
                    azureSubscription: '$(effectiveServiceConnection)'
                    scriptType: 'pscore'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      $ErrorActionPreference = 'Stop'
                      $deployArgs = @{
                        SubscriptionId                  = '$(subscriptionId)'
                        ServiceTier                      = '$(effectiveServiceTier)'
                        ResourceGroupName                = '$(resourceGroupName)'
                        Location                         = '$(location)'
                        ClusterResourceId                = '$(clusterResourceId)'
                        LogAnalyticsWorkspaceResourceId  = '$(logAnalyticsWorkspaceResourceId)'
                        ActionGroupName                  = '$(actionGroupName)'
                        ActionGroupShortName             = '$(actionGroupShortName)'
                        EmailReceiversJson               = '$(emailReceiversJson)'
                        WebhookReceiversJson             = '$(webhookReceiversJson)'
                        CpuThresholdPercent              = [int]'$(cpuThresholdPercent)'
                        MemoryThresholdPercent           = [int]'$(memoryThresholdPercent)'
                        StorageFreeBytesThreshold        = [int64]'$(storageFreeBytesThreshold)'
                        MemoryAvailableBytesThreshold    = [int64]'$(memoryAvailableBytesThreshold)'
                        VolumeLatencyReadThresholdSeconds  = '$(volumeLatencyReadThresholdSeconds)'
                        VolumeLatencyWriteThresholdSeconds = '$(volumeLatencyWriteThresholdSeconds)'
                        NetworkInThresholdBytesPerSecond  = [int64]'$(networkInThresholdBytesPerSecond)'
                        NetworkOutThresholdBytesPerSecond = [int64]'$(networkOutThresholdBytesPerSecond)'
                        IncludeServiceHealth              = [bool]::Parse('$(includeServiceHealth)')
                        SuppressionWindowsJson            = '$(suppressionWindowsJson)'
                        EnableOffHoursSuppression        = [bool]::Parse('$(enableOffHoursSuppression)')
                        ServiceHoursStart                = '$(serviceHoursStart)'
                        ServiceHoursEnd                  = '$(serviceHoursEnd)'
                        ServiceHoursTimeZone              = '$(serviceHoursTimeZone)'
                        HeartbeatMissingMinutes          = [int]'$(heartbeatMissingMinutes)'
                        DenySettingsMode                 = 'denyDelete'
                        ActionOnUnmanage                 = 'deleteResources'
                      }
                      ./scripts/Deploy-AzureLocalAlerts.ps1 @deployArgs
